[build-system]
# Setuptools builds both normal and editable installs from the src/ layout.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infeng"
version = "0.1.0"
description = "Learning inference engine for tiny-gpt2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2,<3",
    "transformers>=4.40,<6",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# API consumers do not need test tooling; contributors install the dev extra.
dev = [
    "pytest>=8.2,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
# Keeping importable code under src/ prevents tests from accidentally importing the
# repository directory instead of the installed package.
where = ["src"]

[tool.pytest.ini_options]
# Tests still work before an editable install because src is added to sys.path.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
